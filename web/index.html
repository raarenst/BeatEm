<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BeatEm Web Client</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon"             type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon"             type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon"                  sizes="180x180" href="/apple-touch-icon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: #111;
    color: #ddd;
    margin: 0;
    padding: 1rem;
    max-width: 880px;
    margin-inline: auto;
  }
  h1 { font-size: 1.1rem; color: #eee; margin: 0 0 0.4rem; }
  label { display: block; margin-top: 0.6rem; font-size: 0.82rem; color: #aaa; }
  input[type="text"], textarea {
    width: 100%;
    background: #1c1c1c;
    color: #ddd;
    border: 1px solid #333;
    padding: 0.4rem 0.5rem;
    font: inherit;
    border-radius: 3px;
  }
  input[readonly] { color: #aaa; background: #161616; }
  button {
    background: #2d2d2d;
    color: #ddd;
    border: 1px solid #444;
    padding: 0.35rem 0.7rem;
    font: inherit;
    cursor: pointer;
    border-radius: 3px;
  }
  button:hover { background: #383838; }
  button.primary { background: #2c5; color: #111; border-color: #2c5; }
  button.primary:hover { background: #4d6; }
  button.danger  { background: #b44; color: #fff; border-color: #b44; }
  button.tiny    { font-size: 0.75rem; padding: 0.2rem 0.5rem; }
  .row { display: flex; gap: 0.4rem; align-items: center; }
  .row > input { flex: 1; }
  #status { color: #888; margin-top: 0.5rem; font-size: 0.85rem; }
  #status.error { color: #f88; }
  #status.ok    { color: #8f8; }
  hr { border: none; border-top: 1px solid #222; margin: 1rem 0; }
  .small { font-size: 0.75rem; color: #777; }
  .hidden { display: none; }

  /* Chat layout */
  .chat-grid {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 0.8rem;
    margin-top: 0.6rem;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1a1a1a;
    border: 1px solid #222;
    padding: 0.5rem 0.7rem;
    border-radius: 3px;
    font-size: 0.85rem;
  }
  .topbar .me-fp {
    font-weight: bold;
    color: #6cc;
  }
  .peer-list {
    background: #0e0e0e;
    border: 1px solid #222;
    border-radius: 3px;
    padding: 0.4rem;
    min-height: 360px;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .peer-entry {
    background: #181818;
    border: 1px solid #2a2a2a;
    border-radius: 3px;
    padding: 0.4rem 0.5rem;
    cursor: pointer;
    font-size: 0.85rem;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .peer-entry:hover { background: #222; }
  .peer-entry.active {
    background: #1f3a3a;
    border-color: #2c5;
  }
  .peer-entry .label  { color: #ddd; }
  .peer-entry .fp     { color: #6cc; font-size: 0.72rem; }
  .peer-entry .badge  {
    color: #fc6;
    font-size: 0.72rem;
  }
  .peer-entry .actions {
    display: none;
    margin-top: 0.25rem;
  }
  .peer-entry:hover .actions { display: flex; gap: 0.3rem; }

  .chat-panel {
    display: flex;
    flex-direction: column;
    min-height: 360px;
  }
  .log {
    background: #0a0a0a;
    border: 1px solid #222;
    padding: 0.5rem;
    height: 320px;
    overflow-y: auto;
    border-radius: 3px;
    font-size: 0.9rem;
    line-height: 1.4;
    flex: 1;
  }
  .log .out  { color: #6cc; }
  .log .in   { color: #fc6; }
  .log .sys  { color: #777; font-style: italic; }
  .send-row { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
  .send-row input { flex: 1; }
  .send-row input:disabled { opacity: 0.5; }
  .placeholder {
    color: #555;
    margin: auto;
    text-align: center;
    font-style: italic;
  }
</style>
</head>
<body>

<h1>BeatEm — web client</h1>
<p class="small">
  Privacy-preserving chat. Every client emits fixed-size packets at a
  fixed cadence; the server broadcasts the union to everyone. Cover
  packets are indistinguishable from real ones on the wire.
</p>

<!-- ===== Setup ===== -->
<div id="setup">
  <label>My secret key (hex, 64 chars)</label>
  <input id="my_sk" type="text" placeholder="hex">
  <label>My public key (hex, 64 chars)</label>
  <div class="row">
    <input id="my_pk" type="text" placeholder="hex">
    <button id="copy_my_pk_btn" type="button" title="Copy">Copy</button>
  </div>
  <label>Server (host:port) — defaults to the same host that served this page</label>
  <input id="server" type="text">
  <div class="row" style="margin-top: 0.6rem;">
    <button id="gen_btn" type="button">Generate new keypair</button>
    <button id="connect_btn" type="button" class="primary">Connect</button>
  </div>
  <p id="status"></p>
</div>

<!-- ===== Chat ===== -->
<div id="chat" class="hidden">
  <div class="topbar">
    <div>
      <span id="me_label">me:</span>
      <span class="me-fp" id="me_fp"></span>
      <button id="copy_my_pk_btn2" type="button" class="tiny" title="Copy my full public key">Copy pubkey</button>
    </div>
    <div class="small" id="info"></div>
    <button id="disconnect_btn" type="button" class="tiny">Disconnect</button>
  </div>
  <div class="chat-grid">
    <div>
      <div class="peer-list" id="peer_list">
        <!-- peer entries injected here -->
      </div>
      <div class="row" style="margin-top: 0.4rem;">
        <input id="new_peer_label" type="text" placeholder="Label (e.g. Alice)">
      </div>
      <div class="row" style="margin-top: 0.3rem;">
        <input id="new_peer_pk" type="text" placeholder="Peer public key (hex)">
        <button id="add_peer_btn" type="button">Add</button>
      </div>
      <p class="small" id="peer_status"></p>
    </div>
    <div class="chat-panel">
      <div class="log" id="log">
        <div class="placeholder" id="no_peer_msg">
          Add or select a peer to start chatting.
        </div>
      </div>
      <div class="send-row">
        <input id="msg" type="text" autocomplete="off" disabled placeholder="Select a peer first">
        <button id="send_btn" type="button" disabled>Send</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
"use strict";

/* libsodium-wrappers via jsDelivr's "+esm" autoconverter; top-level
 * await is supported in all current evergreen browsers, so handlers
 * registered below are guaranteed to see a ready sodium.
 */
import sodium from "https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/+esm";
await sodium.ready;

/* Register the service worker so the page can be "installed" as a PWA
 * (Add to Home Screen on iOS, install prompt on Android Chrome). The
 * worker also lets the UI load instantly when offline — although the
 * actual chat obviously requires the WebSocket back to the server.
 */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch((e) => {
    console.warn("service worker registration failed:", e);
  });
}

/* Default the server field to the same host that served this page, so
 * the typical flow ("beatem_server serves both the page and the WS")
 * works without any manual entry. The user can still override.
 */
const onHttp = (location.protocol === "http:" || location.protocol === "https:");
document.getElementById("server").value = onHttp ? location.host : "localhost:27015";
const wsScheme = (location.protocol === "https:") ? "wss" : "ws";

/* ---- Protocol constants (must match include/crypto.h + protocol.h) ---- */
const NONCE_SIZE     = 24;
const MAC_SIZE       = 16;
const KEY_SIZE       = 32;
const COUNTER_SIZE   = 4;
const HANDSHAKE_SIZE = 16;
const PROTO_MAGIC    = [0x42, 0x45, 0x41, 0x54];  // "BEAT"
const PROTO_VERSION  = 1;
const LS_PEERS_KEY   = "beatem.peers";  // localStorage key for peer list

/* ---- DOM helpers ---- */
const $ = (id) => document.getElementById(id);
const setStatus = (cls, txt) => { $("status").className = cls; $("status").textContent = txt; };
const setPeerStatus = (cls, txt) => {
  $("peer_status").className = "small " + cls;
  $("peer_status").textContent = txt;
};

/* ---- Connection / negotiated state ---- */
let sock = null;
let mySK = null, myPK = null;
let pktSize = 0, plainSize = 0, textSize = 0, maxClients = 0, heartbeatMs = 0;
let sendCounter = 0;
let heartbeatTimer = null;
let pendingPacket = null;  // Uint8Array of size pktSize, or null

/* ---- Per-peer state ----
 *   label      string user-supplied
 *   pk_hex     64-char string
 *   pk_bytes   Uint8Array(32)
 *   recvCount  number, highest seen counter
 *   log        Array<{dir:"in"|"out", text:string}>
 *   unread     number
 */
let peers = [];
let activePeer = null;

/* ---- Small utilities ---- */
const fromHex = (s) => sodium.from_hex(s.trim());
const toHex   = (b) => sodium.to_hex(b);
const readBE32 = (a, o) => ((a[o]<<24)|(a[o+1]<<16)|(a[o+2]<<8)|a[o+3]) >>> 0;
const writeBE32 = (a, o, v) => {
  a[o]   = (v>>>24)&0xFF; a[o+1] = (v>>>16)&0xFF;
  a[o+2] = (v>>> 8)&0xFF; a[o+3] =  v       &0xFF;
};

/* Short fingerprint: first 8 hex chars (4 bytes). Long enough to be
 * meaningful for voice-confirmation, short enough to glance at.
 */
const fingerprint = (pk_hex) => pk_hex.slice(0, 8);

/* Persist peer list (labels + pubkeys, both public info — never the
 * secret key) so reloading the page doesn't lose your contacts.
 */
function savePeers() {
  const slim = peers.map((p) => ({ label: p.label, pk_hex: p.pk_hex }));
  try { localStorage.setItem(LS_PEERS_KEY, JSON.stringify(slim)); }
  catch (_e) { /* ignore quota / private-mode failures */ }
}
function loadStoredPeers() {
  try {
    const raw = localStorage.getItem(LS_PEERS_KEY);
    if (!raw) return [];
    return JSON.parse(raw);
  } catch (_e) { return []; }
}

function copyToClipboard(text) {
  if (navigator.clipboard?.writeText) {
    return navigator.clipboard.writeText(text);
  }
  // Fallback for non-HTTPS contexts where the clipboard API is gated.
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } finally { document.body.removeChild(ta); }
}

/* ---- Peer list rendering ---- */
function renderPeers() {
  const list = $("peer_list");
  list.innerHTML = "";
  for (const p of peers) {
    const div = document.createElement("div");
    div.className = "peer-entry" + (p === activePeer ? " active" : "");
    div.addEventListener("click", () => selectPeer(p));

    const labelEl = document.createElement("div");
    labelEl.className = "label";
    const unread = (p !== activePeer && p.unread > 0) ? ` (${p.unread})` : "";
    labelEl.textContent = p.label + unread;
    div.appendChild(labelEl);

    const fpEl = document.createElement("div");
    fpEl.className = "fp";
    fpEl.textContent = fingerprint(p.pk_hex) + "…";
    div.appendChild(fpEl);

    const actions = document.createElement("div");
    actions.className = "actions";
    const copy = document.createElement("button");
    copy.className = "tiny";
    copy.textContent = "Copy pk";
    copy.addEventListener("click", (e) => {
      e.stopPropagation();
      copyToClipboard(p.pk_hex);
    });
    const rm = document.createElement("button");
    rm.className = "tiny danger";
    rm.textContent = "Remove";
    rm.addEventListener("click", (e) => {
      e.stopPropagation();
      removePeer(p);
    });
    actions.appendChild(copy);
    actions.appendChild(rm);
    div.appendChild(actions);

    list.appendChild(div);
  }
}

function selectPeer(p) {
  activePeer = p;
  p.unread = 0;
  renderPeers();
  renderLog();
  $("msg").disabled = false;
  $("send_btn").disabled = false;
  $("msg").placeholder = `Message ${p.label}`;
  $("msg").focus();
}

function addPeer({ label, pk_hex }) {
  let bytes;
  try { bytes = fromHex(pk_hex); }
  catch (e) {
    setPeerStatus("error", `Invalid hex: ${e.message}`);
    return null;
  }
  if (bytes.length !== KEY_SIZE) {
    setPeerStatus("error", `Public key must be ${KEY_SIZE*2} hex chars.`);
    return null;
  }
  // Dedup by pk_hex (lowercased)
  const normHex = pk_hex.trim().toLowerCase();
  if (myPK && normHex === toHex(myPK).toLowerCase()) {
    setPeerStatus("error", "That's your own public key — peers are for other people.");
    return null;
  }
  if (peers.some((p) => p.pk_hex === normHex)) {
    setPeerStatus("error", "Already added.");
    return null;
  }
  const peer = {
    label: label || ("peer-" + fingerprint(normHex)),
    pk_hex: normHex,
    pk_bytes: bytes,
    recvCount: 0,
    log: [],
    unread: 0,
  };
  peers.push(peer);
  savePeers();
  setPeerStatus("ok", `Added ${peer.label}.`);
  renderPeers();
  if (!activePeer) selectPeer(peer);
  return peer;
}

function removePeer(peer) {
  peers = peers.filter((p) => p !== peer);
  if (activePeer === peer) {
    activePeer = null;
    $("msg").disabled = true;
    $("send_btn").disabled = true;
    $("msg").placeholder = "Select a peer first";
  }
  savePeers();
  renderPeers();
  renderLog();
}

/* ---- Chat log rendering ---- */
function renderLog() {
  const el = $("log");
  el.innerHTML = "";
  if (!activePeer) {
    const p = document.createElement("div");
    p.className = "placeholder";
    p.textContent = peers.length === 0
      ? "Add a peer to start chatting."
      : "Select a peer to view that conversation.";
    el.appendChild(p);
    return;
  }
  for (const entry of activePeer.log) {
    const div = document.createElement("div");
    div.className = entry.dir;
    div.textContent = (entry.dir === "out" ? "me:   " : `${activePeer.label}: `) + entry.text;
    el.appendChild(div);
  }
  el.scrollTop = el.scrollHeight;
}

function appendMessage(peer, dir, text) {
  peer.log.push({ dir, text });
  if (peer !== activePeer && dir === "in") peer.unread++;
  if (peer === activePeer) {
    renderLog();
  } else {
    renderPeers();
  }
}

/* ---- Protocol primitives ---- */
function decodeHandshake(buf) {
  const a = new Uint8Array(buf);
  if (a.length !== HANDSHAKE_SIZE) return null;
  if (a[0] !== PROTO_MAGIC[0] || a[1] !== PROTO_MAGIC[1] ||
      a[2] !== PROTO_MAGIC[2] || a[3] !== PROTO_MAGIC[3]) return null;
  const version = (a[4] << 8) | a[5];
  if (version !== PROTO_VERSION) return null;
  return {
    version,
    max_clients:        (a[6] << 8) | a[7],
    heartbeat_ms:       readBE32(a, 8),
    client_packet_size: readBE32(a, 12),
  };
}

function buildPlaintext(text) {
  const utf8 = new TextEncoder().encode(text);
  const out  = new Uint8Array(plainSize);
  out.set(myPK, 0);

  const now = Math.floor(Date.now() / 1000) >>> 0;
  sendCounter = (now > sendCounter) ? now : (sendCounter + 1) >>> 0;
  writeBE32(out, KEY_SIZE, sendCounter);

  const n = Math.min(utf8.length, textSize);
  out.set(utf8.subarray(0, n), KEY_SIZE + COUNTER_SIZE);
  return out;
}

/* Constant-cadence transmitter. If a real packet is queued, sends it;
 * otherwise sends CSPRNG cover bytes. Never short-circuit this — the
 * fixed cadence IS the privacy property.
 */
function tick() {
  let packet;
  if (pendingPacket) {
    packet = pendingPacket;
    pendingPacket = null;
  } else {
    packet = sodium.randombytes_buf(pktSize);
  }
  if (sock && sock.readyState === WebSocket.OPEN) {
    sock.send(packet);
  }
}

function queueRealMessage(peer, text) {
  if (!peer) return;
  const plain = buildPlaintext(text);
  const nonce = sodium.randombytes_buf(NONCE_SIZE);
  const ct    = sodium.crypto_box_easy(plain, nonce, peer.pk_bytes, mySK);
  const packet = new Uint8Array(pktSize);
  packet.set(nonce, 0);
  packet.set(ct, NONCE_SIZE);
  pendingPacket = packet;
  appendMessage(peer, "out", text);
}

/* For each slot in the broadcast, try each configured peer's pubkey
 * in turn. First successful decrypt routes the message into that
 * peer's chat. Cover bytes / packets to other recipients all fail
 * authentication and are silently skipped.
 */
function handleBroadcast(buf) {
  const arr = new Uint8Array(buf);
  if (arr.length !== maxClients * pktSize) return;

  for (let i = 0; i < maxClients; i++) {
    const slot  = arr.subarray(i * pktSize, (i + 1) * pktSize);
    const nonce = slot.subarray(0, NONCE_SIZE);
    const ct    = slot.subarray(NONCE_SIZE);

    for (const peer of peers) {
      let plain;
      try {
        plain = sodium.crypto_box_open_easy(ct, nonce, peer.pk_bytes, mySK);
      } catch (_e) { continue; }
      if (plain.length !== plainSize) continue;

      // Drop our own echoed packet (crypto_box shared secret is
      // symmetric in the keypair).
      let isOwn = true;
      for (let k = 0; k < KEY_SIZE; k++) {
        if (plain[k] !== myPK[k]) { isOwn = false; break; }
      }
      if (isOwn) break;  // own echo: stop trying this slot's other peers

      // Replay-protection check (per peer).
      const c = readBE32(plain, KEY_SIZE);
      if (c <= peer.recvCount) break;
      peer.recvCount = c;

      let endIdx = plain.length;
      while (endIdx > KEY_SIZE + COUNTER_SIZE && plain[endIdx - 1] === 0) endIdx--;
      const text = new TextDecoder().decode(plain.subarray(KEY_SIZE + COUNTER_SIZE, endIdx));
      appendMessage(peer, "in", text);
      break;  // slot belonged to this peer; don't try others
    }
  }
}

/* ---- Wiring ---- */
$("gen_btn").addEventListener("click", () => {
  const kp = sodium.crypto_box_keypair();
  $("my_sk").value = toHex(kp.privateKey);
  $("my_pk").value = toHex(kp.publicKey);
  setStatus("ok", "New keypair generated. Share the public key with your peers out-of-band.");
});

const copyMyPk = () => {
  copyToClipboard($("my_pk").value);
  setStatus("ok", "Public key copied.");
};
$("copy_my_pk_btn").addEventListener("click", copyMyPk);
$("copy_my_pk_btn2").addEventListener("click", copyMyPk);

/* Auto-trim hex inputs so stray whitespace from copy/paste/email
 * doesn't break parsing.
 */
for (const id of ["my_sk", "my_pk", "new_peer_pk"]) {
  $(id).addEventListener("change", (e) => { e.target.value = e.target.value.trim(); });
}

$("connect_btn").addEventListener("click", () => {
  try {
    mySK = fromHex($("my_sk").value);
    myPK = fromHex($("my_pk").value);
  } catch (e) {
    setStatus("error", `Invalid hex key: ${e.message}`);
    return;
  }
  if (mySK.length !== KEY_SIZE || myPK.length !== KEY_SIZE) {
    setStatus("error", `Each key must be ${KEY_SIZE*2} hex chars.`);
    return;
  }

  const url = wsScheme + "://" + $("server").value;
  setStatus("", `Connecting to ${url}…`);
  sock = new WebSocket(url);
  sock.binaryType = "arraybuffer";

  let gotHandshake = false;

  sock.addEventListener("open", () => {
    setStatus("ok", "Connected. Waiting for protocol handshake…");
  });

  sock.addEventListener("message", (ev) => {
    if (!gotHandshake) {
      const h = decodeHandshake(ev.data);
      if (!h) {
        setStatus("error", "Bad handshake from server.");
        sock.close();
        return;
      }
      maxClients   = h.max_clients;
      heartbeatMs  = h.heartbeat_ms;
      pktSize      = h.client_packet_size;
      plainSize    = pktSize - NONCE_SIZE - MAC_SIZE;
      textSize     = plainSize - KEY_SIZE - COUNTER_SIZE;
      gotHandshake = true;

      // Switch to chat UI
      $("setup").classList.add("hidden");
      $("chat").classList.remove("hidden");
      $("me_fp").textContent = fingerprint(toHex(myPK)) + "…";
      $("info").textContent =
        `${heartbeatMs}ms / ${pktSize}B slots / max ${maxClients} clients · ` +
        `${textSize}B per message`;

      // Hydrate peers from localStorage if any saved. Skip any entry
      // whose pk matches the current local identity — a saved "self
      // peer" entry from an earlier session would otherwise reappear
      // and clutter the list with a chat that can never receive
      // messages (own packets are dropped by the symmetric-key check).
      const myPkHex = toHex(myPK).toLowerCase();
      const stored = loadStoredPeers();
      peers = [];
      let droppedSelf = 0;
      for (const s of stored) {
        const sHex = (s.pk_hex || "").toLowerCase();
        if (sHex === myPkHex) { droppedSelf++; continue; }
        try {
          const bytes = fromHex(sHex);
          if (bytes.length !== KEY_SIZE) continue;
          peers.push({
            label: s.label,
            pk_hex: sHex,
            pk_bytes: bytes,
            recvCount: 0,
            log: [],
            unread: 0,
          });
        } catch (_e) { /* skip bad entries */ }
      }
      if (droppedSelf > 0) savePeers();  // persist the cleanup
      renderPeers();
      renderLog();

      // Start constant-cadence transmitter.
      heartbeatTimer = setInterval(tick, heartbeatMs);
      return;
    }
    handleBroadcast(ev.data);
  });

  sock.addEventListener("close", () => {
    setStatus("error", "Disconnected.");
    if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    $("setup").classList.remove("hidden");
    $("chat").classList.add("hidden");
  });

  sock.addEventListener("error", () => {
    setStatus("error", "WebSocket error (is beatem_server listening on this port?).");
  });
});

$("disconnect_btn").addEventListener("click", () => {
  if (sock) sock.close();
});

$("add_peer_btn").addEventListener("click", () => {
  const pk = $("new_peer_pk").value.trim();
  const label = $("new_peer_label").value.trim();
  if (!pk) {
    setPeerStatus("error", "Paste a peer public key first.");
    return;
  }
  const added = addPeer({ label, pk_hex: pk });
  if (added) {
    $("new_peer_pk").value = "";
    $("new_peer_label").value = "";
  }
});

$("new_peer_pk").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("add_peer_btn").click(); }
});

$("send_btn").addEventListener("click", () => {
  const text = $("msg").value;
  if (!text || !activePeer) return;
  queueRealMessage(activePeer, text);
  $("msg").value = "";
});

$("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("send_btn").click(); }
});
</script>
</body>
